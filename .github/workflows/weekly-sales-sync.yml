name: Weekly sales sync
on:
  schedule:
    # Sunday 21:00 UTC = Monday 05:00 Asia/Manila.
    - cron: '0 21 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weekly-sales-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install sync dependencies
        run: |
          python -m pip install Pillow ddgs
          npm install --ignore-scripts
      - name: Configure commit author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Sync sales and publish repository update
        env:
          UBEST_BASE_URL: ${{ secrets.UBEST_BASE_URL }}
          UBEST_API_KEY: ${{ secrets.UBEST_API_KEY }}
        run: python scripts/weekly_sync.py
