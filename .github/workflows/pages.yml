name: Deploy browser editor to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Weekly sales sync"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Sales sync commits using GITHUB_TOKEN, which does not trigger push workflows.
          # On completion, deploy the current main branch, including its new sales commit.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build_pages.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: node mobile-review.cjs
      - run: node studio-review.cjs
      - run: node studio-review.cjs --mobile
      - run: node background-remover-review.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: pages_artifact
        with:
          # A job retry uploads again; select only this attempt's artifact.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: public
      - name: Publish
        id: deploy
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        with:
          script: |
            // Use the upload receipt directly; artifact name listing can lag behind upload.
            const artifactId = process.env.PAGES_ARTIFACT_ID;
            if (!/^\d+$/.test(artifactId || '')) throw new Error('Upload did not return an artifact ID');
            const { owner, repo } = context.repo;
            const oidcToken = await core.getIDToken();
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo, artifact_id: Number(artifactId),
              pages_build_version: context.sha, oidc_token: oidcToken
            });
            core.setOutput('page_url', deployment.page_url);
            const deadline = Date.now() + 600000;
            while (Date.now() < deadline) {
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                owner, repo, deployment_id: deployment.id
              });
              core.info(`Pages deployment status: ${data.status}`);
              if (data.status === 'succeed') return;
              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost', 'failed', 'cancelled'].includes(data.status)) {
                throw new Error(`Pages deployment failed: ${data.status}`);
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel', {
              owner, repo, deployment_id: deployment.id
            });
            throw new Error('Pages deployment timed out after 10 minutes');
