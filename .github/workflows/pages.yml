name: Deploy browser editor to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Weekly sales sync"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Sales sync commits using GITHUB_TOKEN, which does not trigger push workflows.
          # On completion, deploy the current main branch, including its new sales commit.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build_pages.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: node mobile-review.cjs
      - run: node studio-review.cjs
      - run: node studio-review.cjs --mobile
      - run: node background-remover-review.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # A job retry uploads again; select only this attempt's artifact.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: public
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
